name: Integrar interfaz v2

on:
  push:
    branches: ["main"]
    paths:
      - "ui-v2.js"
      - ".github/workflows/integrar-ui-v2.yml"

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar interfaz nueva
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="ui-v2.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          s=s.replace('Programa interactivo · Días 1–7','Programa interactivo · Sesiones independientes')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar menú independiente y panel amigable del tutor"
          git push
