name: Integrar ajustes de contenido

on:
  push:
    branches: ["main"]
    paths:
      - "pedagogy-content-fix.js"
      - ".github/workflows/integrar-ajustes-contenido.yml"

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar ajustes de contenido
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="pedagogy-content-fix.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar ajustes de contenido pedagógico"
          git push