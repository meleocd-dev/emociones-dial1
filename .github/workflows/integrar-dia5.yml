name: Integrar Día 5

on:
  push:
    branches: ["main"]
    paths:
      - "day5.js"
      - ".github/workflows/integrar-dia5.yml"

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar módulo Día 5
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<script src="day5.js"></script>' not in s:
              s=s.replace('</body>', '<script src="day5.js"></script>\n</body>')
          s=s.replace('Programa interactivo · Días 1–4','Programa interactivo · Días 1–5')
          s=s.replace('Día 4: diferentes puntos de vista</p>','Día 4: diferentes puntos de vista · Día 5: responder exactamente lo preguntado</p>')
          s=s.replace('Aquí aparecen las respuestas de los cuatro días.','Aquí aparecen las respuestas de los cinco días.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrar Día 5 en la app"
          git push
